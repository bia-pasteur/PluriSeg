[project]
authors = [{name = "Julie Mabon"}]
dependencies = ["fluometrik>=1.0.1,<2", "dynamic-network-architectures>=0.4.4,<0.5", "ncolor>=2.3.0,<3"]
name = "PluriSeg"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
  # The CUDA platform is listed first, so it wins platform selection on a machine with a CUDA driver.
  { name = "linux-64-cuda", platform = "linux-64", cuda = "12.0" },
  { name = "linux-64-cpu", platform = "linux-64" },
]

[tool.pixi.pypi-dependencies]
pluriseg = { path = ".", editable = true }

[tool.pixi.target.linux-64-cuda.dependencies]
cuda-version = "12.8.*"
pytorch-gpu = "*"

[tool.pixi.target.linux-64-cpu.dependencies]
pytorch-cpu = "*"

[tool.pixi.tasks]

[tool.pixi.dependencies]
pydantic = ">=2.14.3,<3"
matplotlib = ">=3.11.2,<4"
numpy = ">=2.5.5,<3"
scipy = ">=1.18.1,<2"
jsonargparse = ">=4.40.2,<5"
lightning = ">=2.6.6,<3"
rich = ">=15.0.0,<16"
imageio = ">=2.38.2,<3"
pandas = ">=3.1.1,<4"
tifffile = ">=2026.11.12,<2027"
glasbey = ">=0.4.0,<0.5"
pytest = ">=9.2.0,<10"
fastremap = ">=1.20.0,<2"
fill-voids = ">=2.1.2,<3"
scikit-image = ">=0.26.0,<0.27"
shapely = ">=2.2.0,<3"
edt = ">=3.1.2,<4"
seaborn = ">=0.13.2,<0.14"
